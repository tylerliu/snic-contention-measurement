program_flags:
  monitor-devices: ["03:00.0,dv_flow_en=2", "03:00.1,dv_flow_en=2"]
  host-reps: ["pf0hpf,dv_flow_en=2", "pf1hpf,dv_flow_en=2"]
  disable-host: false
  monitor-dest: none
  sampling-fraction: 0.0
  enable-counters: true
  log-level: INFO
  ipsec-decap-flow-count: 64
  ipsec-decap-spi: [0x2001, 0x3001]
  ipsec-decap-key:
    - "aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899"
    - "aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899"
  ipsec-decap-salt: [0x22334455, 0x22334455]
  ipsec-decap-iv: [0x1234567890abcdef, 0x1234567890abcdef]
  ipsec-decap-src-mac: ["58:a2:e1:53:19:e6", "58:a2:e1:53:19:e7"]
  ipsec-decap-dst-mac: ["58:a2:e1:53:19:d6", "58:a2:e1:53:19:d7"]
  ipsec-decap-anti-replay: true
dpdk_args:
  # Nonexistent allowlist entry prevents automatic PF probing; DOCA probes both.
  devices: ["00:00.0"]
  l: "1-5"
