#
# Sample Monitoring App configuration for the new YAML parser.
#
program_flags:
  monitor-devices: 
    - "03:00.0,dv_flow_en=2"
    - "03:00.1,dv_flow_en=2"
  host-reps: 
    - "pf0hpf,dv_flow_en=2"
    - "pf1hpf,dv_flow_en=2"
  tunnel-udp-port: 4789
  tunnel-vxlan-id: 0
  disable-host: false
  monitor-dest: 
    - "en3f0pf0sf4,dv_flow_en=2"
    - "en3f1pf1sf6,dv_flow_en=2"
  sampling-fraction: 0.99
  enable-counters: true
  log-level: INFO

  # IPsec Decapsulation (Inbound) Configuration
  ipsec-decap-spi: 
  - 0x2001
  - 0x2002
  ipsec-decap-key: 
  - "aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899"
  - "99887766554433221100ffeeddccbbaa99887766554433221100ffeeddccbbaa"
  ipsec-decap-salt: 
  - 0x22334455
  - 0x66778899
  ipsec-decap-iv: 
  - 0x1234567890abcdef
  - 0xfedcba0987654321
  ipsec-decap-src-mac:
  - 58:a2:e1:53:19:d6
  - 58:a2:e1:53:19:d7
  ipsec-decap-dst-mac:
  - 92:a5:69:e8:e5:49
  - e2:fa:40:70:4f:b7
  ipsec-decap-anti-replay: true

  # IPsec Encapsulation (Outbound) Configuration
  ipsec-encap-src-ip: 
  - 172.16.1.2
  - 172.16.2.2
  ipsec-encap-dst-ip: 
  - 172.16.1.20
  - 172.16.2.20
  ipsec-encap-src-mac: 
  - 92:a5:69:e8:e5:49
  - e2:fa:40:70:4f:b7
  ipsec-encap-dst-mac: 
  - 58:a2:e1:53:19:d6
  - 58:a2:e1:53:19:d7
  ipsec-encap-spi: 
  - 0x1001
  - 0x1002
  ipsec-encap-key: 
  - "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
  - "ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100"
  ipsec-encap-salt: 
  - 0x11223344
  - 0x55667788
  ipsec-encap-iv: 
  - 0x1234567890abcdef
  - 0xfedcba0987654321

dpdk_args:
  # Additional DPDK (EAL) flags if required
  # Use single-letter keys for short options, or full names for long options
  devices:
    - ""
  l: "8-10" # use 8 as main thread, 9-10 for 2 cores

